<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conectando con MercadoLibre...</title>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      text-align: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 48px;
      max-width: 400px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #334155;
      border-top-color: #FFE600;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { color: #f1f5f9; margin: 0 0 8px; font-size: 1.1rem; }
    p  { font-size: 0.85rem; margin: 0; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h2 id="title">Autorizando acceso...</h2>
    <p id="msg">Redirigiendo a tu panel de ML Manager</p>
  </div>

  <script>
    // Puerto configurable: cambia si usas un puerto distinto
    const LOCAL_PORT = 8000;

    const params = new URLSearchParams(window.location.search);
    const code  = params.get('code');
    const error = params.get('error');

    if (error) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = 'Acceso denegado';
      document.getElementById('msg').innerHTML = `<span class="error">MercadoLibre rechazó la autorización: ${error}</span>`;
    } else if (code) {
      // Forward the code to the local FastAPI server
      window.location.href = `http://localhost:${LOCAL_PORT}/callback?code=${encodeURIComponent(code)}`;
    } else {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = 'Página de callback OAuth';
      document.getElementById('msg').textContent = 'Esta página recibe el código de autorización de MercadoLibre y lo reenvía a la aplicación local.';
    }
  </script>
</body>
</html>
